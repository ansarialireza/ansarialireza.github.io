<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151B21" />
      <stop offset="100%" stop-color="#0E1318" />
    </linearGradient>
    <linearGradient id="limeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#CCFF00" stop-opacity="1" />
      <stop offset="100%" stop-color="#CCFF00" stop-opacity="0.2" />
    </linearGradient>
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <style>
    .mono-label {
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      font-size: 11px;
      fill: #8B949E;
    }
    .mono-bold {
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #F4F7FA;
    }
    .mono-lime {
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #CCFF00;
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: dash 15s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -100;
      }
    }
  </style>

  <!-- Layer 1: Ingestion Sources -->
  <g transform="translate(20, 30)">
    <rect width="130" height="90" rx="8" fill="url(#boxGrad)" stroke="#28313A" stroke-width="1.2" />
    <text x="14" y="26" class="mono-lime">01 / SOURCES</text>
    <text x="14" y="48" class="mono-bold">Business Data</text>
    <text x="14" y="68" class="mono-label">PDF · Docs · Web</text>
    <circle cx="115" cy="24" r="3" fill="#CCFF00" />
  </g>

  <!-- Flow Arrow: Sources -> Vector Ingestion -->
  <path d="M 150 75 L 200 75" stroke="#CCFF00" stroke-width="1.5" class="flow-line" />
  <polygon points="198,71 206,75 198,79" fill="#CCFF00" />

  <!-- Layer 2: Vector Pipeline / Weirwise RAG Core -->
  <g transform="translate(205, 30)">
    <rect width="150" height="130" rx="8" fill="url(#boxGrad)" stroke="#CCFF00" stroke-width="1.4" />
    <rect x="0" y="0" width="150" height="4" rx="2" fill="#CCFF00" />
    <text x="14" y="28" class="mono-lime">WEIRWISE CORE</text>
    <text x="14" y="52" class="mono-bold">RAG Retrieval</text>
    <text x="14" y="74" class="mono-label">Chunking &amp; Embed</text>
    <text x="14" y="94" class="mono-label">PostgreSQL / pgvector</text>
    <text x="14" y="114" class="mono-label">Tenant Isolation</text>
  </g>

  <!-- Flow Arrow: RAG Core -> Assistant Execution -->
  <path d="M 280 160 L 280 205" stroke="#CCFF00" stroke-width="1.5" class="flow-line" />
  <polygon points="276,203 280,211 284,203" fill="#CCFF00" />

  <!-- Layer 3: Application & Assistant Layer -->
  <g transform="translate(190, 210)">
    <rect width="180" height="130" rx="8" fill="url(#boxGrad)" stroke="#28313A" stroke-width="1.2" />
    <text x="16" y="28" class="mono-lime">02 / ORCHESTRATION</text>
    <text x="16" y="52" class="mono-bold">Assistant Runtime</text>
    <text x="16" y="74" class="mono-label">Context Synthesis</text>
    <text x="16" y="94" class="mono-label">Grounding &amp; Security</text>
    <text x="16" y="114" class="mono-label">FastAPI / Django REST</text>
  </g>

  <!-- Flow to Multi-Channel Distribution -->
  <!-- Left: Web Component Widget -->
  <path d="M 190 285 L 140 285" stroke="#28313A" stroke-width="1.5" />
  <polygon points="142,281 134,285 142,289" fill="#8B949E" />

  <g transform="translate(15, 240)">
    <rect width="120" height="90" rx="8" fill="url(#boxGrad)" stroke="#28313A" stroke-width="1" />
    <text x="12" y="24" class="mono-lime">03 / CLIENT</text>
    <text x="12" y="44" class="mono-bold">Web Widget</text>
    <text x="12" y="64" class="mono-label">Shadow DOM</text>
    <text x="12" y="78" class="mono-label">Embeddable UI</text>
  </g>

  <!-- Right: Automated APIs / Telegram Channels -->
  <path d="M 370 285 L 415 285" stroke="#CCFF00" stroke-width="1.5" class="flow-line" />
  <polygon points="413,281 421,285 413,289" fill="#CCFF00" />

  <g transform="translate(420, 240)">
    <rect width="85" height="90" rx="8" fill="url(#boxGrad)" stroke="#28313A" stroke-width="1" />
    <text x="10" y="24" class="mono-lime">04 / CHANNELS</text>
    <text x="10" y="44" class="mono-bold">APIs</text>
    <text x="10" y="64" class="mono-label">Telegram</text>
    <text x="10" y="78" class="mono-label">REST / SDK</text>
  </g>

  <!-- Bottom Architecture Metrics / Guardrails -->
  <g transform="translate(20, 355)">
    <circle cx="6" cy="6" r="3" fill="#CCFF00" />
    <text x="16" y="9" class="mono-label">Deterministic Grounding</text>
    <circle cx="190" cy="6" r="3" fill="#CCFF00" />
    <text x="200" y="9" class="mono-label">Sub-second Vector Query</text>
    <circle cx="375" cy="6" r="3" fill="#CCFF00" />
    <text x="385" y="9" class="mono-label">Zero Data Leaks</text>
  </g>
</svg>
